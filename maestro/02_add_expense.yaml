appId: com.docash
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Current balance'
    timeout: 60000
- tapOn:
    id: 'fab-expense'
- tapOn:
    id: 'entry-amount'
- inputText: '100'
- tapOn:
    id: 'category-select'
- tapOn: 'Food'
- tapOn:
    id: 'entry-submit'
- extendedWaitUntil:
    visible: '-\$100\.00'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: 'Food'
    direction: DOWN
