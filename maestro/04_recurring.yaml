appId: com.docash
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Current balance'
    timeout: 60000
- tapOn:
    id: 'tab-recurring'
- extendedWaitUntil:
    visible: 'Add recurring'
    timeout: 15000
- tapOn: 'Add recurring'
- extendedWaitUntil:
    visible:
      id: 'recurring-kind-expense'
    timeout: 10000
- tapOn:
    id: 'recurring-kind-expense'
- assertVisible: 'Food'
